name: BDD Clickthrough (Playwright)

on:
  workflow_dispatch:
  push:
    paths:
      - "bdd_tests/**"
      - ".github/workflows/bdd-ui.yml"
      - "requirements/bdd.txt"
      - "Dockerfile.x11"
  pull_request:
    paths:
      - "bdd_tests/**"
      - ".github/workflows/bdd-ui.yml"
      - "requirements/bdd.txt"
      - "Dockerfile.x11"

jobs:
  bdd-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/bdd.txt
          python -m playwright install --with-deps chromium
      - name: Run BDD clickthrough
        env:
          PLAYWRIGHT_VIDEO_DIR: artifacts/playwright
          PLAYWRIGHT_SCREENSHOT_DIR: artifacts/screenshots
          PLAYWRIGHT_HEADLESS: "1"
        run: |
          pytest bdd_tests -vv
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-clickthrough-artifacts
          path: artifacts
